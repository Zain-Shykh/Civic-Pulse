# Deliberately does NOT re-run the test suite. A v* tag is only ever
# pushed against a commit on `main` that has already passed cd.yml's own
# `test` job (dev -> main is gated by required-status-check branch
# protection) -- re-testing here would just duplicate that run. This
# workflow re-tags the exact image cd.yml already built, tested, and
# pushed for that commit's SHA; it never rebuilds from source. If that
# SHA tag doesn't already exist in GHCR, this fails loudly (imagetools
# has nothing to copy) rather than silently building something
# unvalidated.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: lc
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag already-pushed SHA images with the release semver tag
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.lc.outputs.owner }}/civicpulse-backend:${{ github.ref_name }} \
            ghcr.io/${{ steps.lc.outputs.owner }}/civicpulse-backend:${{ github.sha }}
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.lc.outputs.owner }}/civicpulse-frontend:${{ github.ref_name }} \
            ghcr.io/${{ steps.lc.outputs.owner }}/civicpulse-frontend:${{ github.sha }}
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.lc.outputs.owner }}/civicpulse-ollama:${{ github.ref_name }} \
            ghcr.io/${{ steps.lc.outputs.owner }}/civicpulse-ollama:${{ github.sha }}

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes --title ${{ github.ref_name }}
