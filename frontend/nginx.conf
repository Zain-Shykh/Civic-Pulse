# Implements ADR 0002 (docs/adr/0002-frontend-runtime-config.md): the
# built JS never holds an absolute backend URL. Relative requests to
# /api/... are proxied here; the upstream host "backend" is the Compose
# service name / k8s Service name, resolved at the network layer, not
# baked into the image.
server {
    # 8080, not 80: the container runs as a non-root USER (Dockerfile),
    # and binding a port below 1024 needs root privileges it doesn't have.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
