apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Schema bootstrap (docs/specs/phase-11-kubernetes-manifests.md, Open
        # Question 6) — must exit 0 against a real Postgres before the main
        # container starts. No environment so far (dev compose, CI) has ever
        # automated this; here it's a Kubernetes-native initContainer instead
        # of a manual `kubectl exec` step.
        - name: migrate
          image: civicpulse-backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: civicpulse-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secret
                  key: DATABASE_URL
      containers:
        - name: backend
          image: civicpulse-backend
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: civicpulse-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secret
                  key: DATABASE_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secret
                  key: GEMINI_API_KEY
          resources:
            requests:
              # VPA-recommended, not guessed — docs/specs/
              # phase-11b-failfast-and-vpa-verification.md's As-Built.
              # Phase 11's original guess (500m/256Mi, a halved-limit
              # heuristic) is superseded by this real kubectl describe vpa
              # backend-vpa Target under real load.
              cpu: 163m
              memory: 250Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
