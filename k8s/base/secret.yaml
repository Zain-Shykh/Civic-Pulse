# Placeholder values only — never a real password/key committed here.
# Real values are injected out-of-band before a genuine deploy (see
# k8s/overlays/prod/README.md); this file exists so `kubectl apply -k`
# has something to apply for local/dev smoke-testing.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secret
  namespace: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: changeme
  GEMINI_API_KEY: changeme
  # Composed connection string — mechanically required to live whole in the
  # Secret since it embeds POSTGRES_PASSWORD (docs/specs/phase-11-kubernetes-manifests.md,
  # Deliverable (c)). Must be kept in sync with POSTGRES_USER/POSTGRES_DB in
  # configmap.yaml and POSTGRES_PASSWORD above if either changes.
  DATABASE_URL: postgresql+psycopg://civicpulse:changeme@postgres:5432/civicpulse
